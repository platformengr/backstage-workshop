# Owned by the platform team. Who exists and who belongs to which team.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: acme
  title: Acme
spec:
  type: organization
  children: [platform, team-checkout]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform
  title: Platform team
spec:
  type: team
  parent: acme
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-checkout
  title: Team Checkout
spec:
  type: team
  parent: acme
  children: []
---
# You. The name must match your GitHub username so sign-in can find you.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: YOUR_GITHUB_USER
spec:
  memberOf: [platform, team-checkout]
