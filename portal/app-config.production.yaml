# Loaded on top of app-config.yaml inside the container (see the Dockerfile CMD).
# Only what differs from your laptop goes here.
app:
  # The backend serves the frontend in production, so both use one URL.
  baseUrl: http://localhost:7007

backend:
  baseUrl: http://localhost:7007
  listen: ':7007'
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

techdocs:
  generator:
    # No Docker inside the container: mkdocs is installed in the image instead.
    runIn: local

catalog:
  # Lists replace, they do not merge, so every location is repeated here with
  # paths relative to /app in the image.
  locations:
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [Group, User]
    - type: file
      target: ./catalog/systems.yaml
      rules:
        - allow: [Domain, System]
    - type: file
      target: ./templates/node-service/template.yaml
      rules:
        - allow: [Template]
